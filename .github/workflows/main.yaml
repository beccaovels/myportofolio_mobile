name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI: build_runner -> dart format check -> flutter analyze -> tests + coverage.
  build:
    uses: VeryGoodOpenSource/very_good_workflows/.github/workflows/flutter_package.yml@v2
    with:
      setup: dart run build_runner build --delete-conflicting-outputs
      coverage_excludes: "**/*.g.dart"
      min_coverage: 0
      timeout_minutes: 15

  # CD: only after CI passes, build a release APK and upload it as an artifact.
  build_apk:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate json_serializable code
        run: dart run build_runner build --delete-conflicting-outputs

      # API_BASE_URL is a repository variable (Settings > Secrets and
      # variables > Actions > Variables) pointing to the deployed Django
      # backend. Whitespace (e.g. a pasted trailing newline) is stripped, and
      # the build stops early if the variable is missing, because an empty
      # value would override the default in lib/config.dart.
      - name: Build release APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          API_BASE_URL="$(printf '%s' "$API_BASE_URL" | tr -d '[:space:]')"
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set."
            exit 1
          fi
          echo "Building with API_BASE_URL=$API_BASE_URL"
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
